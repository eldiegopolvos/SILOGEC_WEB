name: Inspect SILOGEC payload formats

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect-payload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Decode repaired payloads
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee payload-format.log
          from pathlib import Path
          import base64, gzip, hashlib, io, itertools, lzma, tarfile

          root=Path('.silogec-candidates')
          text={p.name:p.read_text('ascii') for p in root.glob('*.txt')}

          def inspect(label, joined):
              print('\n===', label, 'chars', len(joined), 'mod4', len(joined)%4, '===')
              for pad in ('', '=', '==', '==='):
                  try:
                      raw=base64.b64decode(joined+pad, validate=True)
                  except Exception as exc:
                      print('base64_fail pad',repr(pad),type(exc).__name__,str(exc)); continue
                  print('base64_ok pad',repr(pad),'bytes',len(raw),'sha',hashlib.sha256(raw).hexdigest(),'prefix',raw[:12])
                  for fmt,decoder in [('xz',lzma.decompress),('gzip',gzip.decompress)]:
                      try:
                          out=decoder(raw)
                      except Exception as exc:
                          print(fmt+'_fail',type(exc).__name__,str(exc)); continue
                      print(fmt+'_ok','expanded',len(out),'sha',hashlib.sha256(out).hexdigest(),'prefix',repr(out[:100]))
                      try:
                          with tarfile.open(fileobj=io.BytesIO(out),mode='r:') as tf:
                              names=tf.getnames()
                          print('tar_ok members',len(names))
                          for n in names[:80]: print(' ',n)
                      except Exception as exc:
                          print('tar_fail',type(exc).__name__,str(exc))

          inspect('06+07', text['06-f240.txt']+text['07-7a91.txt'])
          inspect('06+07+09', text['06-f240.txt']+text['07-7a91.txt']+text['09-47e8.txt'])
          inspect('10+11', text['10-eccd.txt']+text['11-7c1b.txt'])

          # Test likely sequences for the first XZ stream, including the known half-chunk substitution.
          candidates=['02-3445.txt','03-4a39.txt','04-4c57.txt','09-47e8.txt']
          for r in range(1,len(candidates)+1):
              for perm in itertools.permutations(candidates,r):
                  inspect('01+'+'+'.join(perm), text['01-c15.txt']+''.join(text[n] for n in perm))
          PY

      - name: Upload format diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: silogec-payload-format-diagnostics
          path: payload-format.log
          retention-days: 1
