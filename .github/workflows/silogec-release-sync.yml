name: Diagnose SILOGEC source payload

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose-payload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Inspect candidate payloads
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee payload-diagnostics.log) 2>&1

          echo "== Candidate files =="
          for f in .silogec-candidates/*; do
            echo "--- $f"
            wc -c "$f"
            file "$f"
            sha256sum "$f"
            printf 'PREFIX: '
            head -c 80 "$f" | tr '\n' ' '
            echo
          done

          echo "== Individual base64 decode checks =="
          shopt -s nullglob
          for f in .silogec-candidates/*.txt; do
            out="/tmp/$(basename "$f").decoded"
            if base64 --decode "$f" > "$out" 2>/dev/null; then
              echo "DECODE_OK $f"
              file "$out"
              if xz -t "$out" 2>/dev/null; then
                echo "XZ_OK $f"
                tar -tJf "$out" | head -30 || true
              fi
            else
              echo "DECODE_FAIL $f"
            fi
          done

          echo "== Contiguous text combinations =="
          mapfile -t files < <(find .silogec-candidates -maxdepth 1 -name '*.txt' | sort)
          count=${#files[@]}
          for ((i=0; i<count; i++)); do
            parts=()
            for ((j=i; j<count; j++)); do
              parts+=("${files[j]}")
              cat "${parts[@]}" > /tmp/combo.b64
              if base64 --decode /tmp/combo.b64 > /tmp/combo.bin 2>/dev/null; then
                if xz -t /tmp/combo.bin 2>/dev/null; then
                  echo "VALID_XZ start=$i end=$j"
                  printf 'FILES:'
                  printf ' %s' "${parts[@]}"
                  echo
                  sha256sum /tmp/combo.bin
                  file /tmp/combo.bin
                  echo "ARCHIVE_LIST_BEGIN"
                  tar -tJf /tmp/combo.bin | head -60 || true
                  echo "ARCHIVE_LIST_END"
                fi
              fi
            done
          done

          echo "== Binary candidate =="
          if [ -f .silogec-candidates/08-7cfa.bin ]; then
            file .silogec-candidates/08-7cfa.bin
            sha256sum .silogec-candidates/08-7cfa.bin
            if xz -t .silogec-candidates/08-7cfa.bin 2>/dev/null; then
              echo "BINARY_XZ_OK"
              tar -tJf .silogec-candidates/08-7cfa.bin | head -60 || true
            else
              echo "BINARY_XZ_FAIL"
            fi
          fi

      - name: Upload payload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: silogec-payload-diagnostics
          path: payload-diagnostics.log
          retention-days: 1
